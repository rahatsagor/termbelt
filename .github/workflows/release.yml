name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'rahatsagor/termbelt'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - run: bun run check
      - run: bun run vuln
      - run: bun run build:release
      - run: bun run pack
      - run: bun run test:package
      - name: Publish platform packages, then the launcher
        run: bun scripts/publish.cjs --ci
      - name: Publish native release archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/releases/* --verify-tag --generate-notes --title "Termbelt $RELEASE_TAG"
      # HOMEBREW_TAP_TOKEN (optional secret): a token with contents write access to rahatsagor/homebrew-tap.
      - name: Update Homebrew tap
        if: env.HAS_TAP_TOKEN == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          TAP="$RUNNER_TEMP/homebrew-tap"
          gh repo clone rahatsagor/homebrew-tap "$TAP" -- --depth 1
          mkdir -p "$TAP/Formula"
          bun scripts/homebrew.cjs dist/releases/SHA256SUMS > "$TAP/Formula/termbelt.rb"
          cd "$TAP"
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/termbelt.rb
          if ! git diff --cached --quiet; then
            git commit -m "termbelt ${RELEASE_TAG#v}"
            git push
          fi
