name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go / ${{ matrix.os }} / ${{ matrix.go }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, go: stable}
          - {os: macos-latest, go: stable}
          - {os: windows-latest, go: stable}
          - {os: ubuntu-latest, go: '1.26.x'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      TERMBELT_IP_API_URL: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: go mod verify
      - run: go test -race ./...
      - run: go vet ./...
      - name: Build and exercise native executable
        shell: bash
        env:
          TERMBELT_CONFIG: ${{ runner.temp }}/termbelt-config.json
        run: |
          suffix=''
          if [ "$RUNNER_OS" = 'Windows' ]; then suffix='.exe'; fi
          go build -trimpath -ldflags='-s -w' -o "build/termbelt$suffix" .
          "build/termbelt$suffix" uuid --count 2 --json
          "build/termbelt$suffix" ports --json > /dev/null
          "build/termbelt$suffix" dns example.com --type A --json > /dev/null

  package:
    name: Package / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - run: bun run build:release
      - run: bun run pack
      - run: bun run test:package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-${{ runner.os }}
          path: dist/packages/*.tgz
          if-no-files-found: error
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: go test ./internal/core -run '^$' -fuzz '^FuzzDomainNormalization$' -fuzztime 10s -parallel 2
      - run: go test ./internal/core -run '^$' -fuzz '^FuzzTimestampParsing$' -fuzztime 10s -parallel 2
